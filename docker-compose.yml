services:
  web:
    build:
      context: ./app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
    volumes:
      - static_volume:/app/staticfiles
      - logs_volume:/app/logs
      - ./auth:/auth:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started
    restart: unless-stopped

  log-indexer:
    build:
      context: ./app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
    volumes:
      - logs_volume:/app/logs
    command: >
      sh -c "while true; do
        python manage.py index_logs;
        sleep 60;
      done"
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/static:ro
    ports:
      - "80:80"
      - "5000:80"
    depends_on:
      - web
      - registry
    restart: unless-stopped

  registry:
    image: registry:2
    environment:
      REGISTRY_AUTH: token
      REGISTRY_AUTH_TOKEN_REALM: http://localhost:5000/registry/token/
      REGISTRY_AUTH_TOKEN_SERVICE: uks-registry
      REGISTRY_AUTH_TOKEN_ISSUER: uks-registry-auth
      REGISTRY_AUTH_TOKEN_ROOTCERTBUNDLE: /auth/registry-auth.crt
      REGISTRY_HTTP_HOST: http://localhost:5000
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - ./auth:/auth:ro
      - registry_data:/var/lib/registry
    expose:
      - "5000"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  static_volume:
  logs_volume:
  registry_data:
