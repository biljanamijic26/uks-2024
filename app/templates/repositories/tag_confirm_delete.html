{% extends "base.html" %}

{% block title %}Delete {{ tag.full_name }} - Docker Registry Platform{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4 p-md-5">
                <h1 class="h3 mb-3"><i class="bi bi-exclamation-triangle-fill text-danger me-2"></i>Delete tag</h1>
                <p class="mb-4">
                    Are you sure you want to delete <strong>{{ tag.full_name }}</strong>?
                    This action cannot be undone.
                </p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash me-1"></i>Yes, delete
                        </button>
                        <a href="{% url 'repository_detail' owner=tag.repository.owner.username name=tag.repository.name %}"
                           class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
